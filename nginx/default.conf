server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 12M;

    charset utf-8;

    # Fix #2: pastikan .mjs disajikan sebagai application/javascript
    # (ES module), bukan application/octet-stream.
    types {
        application/javascript js mjs;
        text/css css;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets (no build step, so mostly CSS/JS from CDN)
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PDF.js worker (.mjs) — MIME sudah benar dari types server-level.
    # Beri no-cache agar browser tidak memakai versi stale (MIME salah) pasca-deploy.
    location ~* /pdfjs/.*\.mjs$ {
        add_header Cache-Control "no-cache, max-age=0";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass logbook-ta-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
