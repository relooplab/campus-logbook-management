name: logbook-ta

# ============================================================================
# Variabel environment (dari file .env di host).
# Wajib: APP_KEY (lihat catatan di README). Opsional: DB_PASSWORD, dll.
# ============================================================================
x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "${APP_URL:-http://localhost:8280}"
  # Fix #3: APP_KEY wajib di-set (di-generate manual) agar Laravel boot.
  APP_KEY: "${APP_KEY:?APP_KEY must be set in the deployment environment}"
  # Fix #5: DB_CONNECTION di-set di semua worker (default sqlite jika kosong).
  DB_CONNECTION: mysql
  DB_HOST: logbook-ta-db
  DB_PORT: 3306
  DB_DATABASE: logbook_ta
  DB_USERNAME: logbook
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in the deployment environment}"
  REDIS_HOST: logbook-ta-redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # Fix #4: BROADCAST + seluruh env Reverb/Pusher (crash bila hanya SERVER_HOST).
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: "${REVERB_APP_ID:?REVERB_APP_ID must be set in the deployment environment}"
  REVERB_APP_KEY: "${REVERB_APP_KEY:?REVERB_APP_KEY must be set in the deployment environment}"
  REVERB_APP_SECRET: "${REVERB_APP_SECRET:?REVERB_APP_SECRET must be set in the deployment environment}"
  REVERB_HOST: logbook-ta-reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  MAIL_MAILER: smtp
  MAIL_HOST: logbook-ta-mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: "no-reply@example.com"
  MAIL_FROM_NAME: "Thesis Logbook Management"

services:
  # ------------------------------------------------------------------ app
  logbook-ta-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: logbook-ta-app:latest
    container_name: logbook-ta-app
    restart: unless-stopped
    environment: *app-env
    depends_on:
      logbook-ta-db:
        condition: service_healthy
      logbook-ta-redis:
        condition: service_healthy
      logbook-ta-mailpit:
        condition: service_started
    volumes:
      - app_storage:/var/www/storage
      # Fix #6: shared public agar nginx bisa serve aset.
      - public_pp:/var/www/public
    networks: [backend]

  # ----------------------------------------------------------------- nginx
  logbook-ta-nginx:
    # Fix #7: konfigurasi vhost di-BAKE ke image (bukan bind-mount) agar
    # stack dapat di-deploy dari Portainer (file stack tersimpan di filesystem
    # container Portainer, bukan di host — bind-mount relatif akan gagal).
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: logbook-ta-nginx:latest
    container_name: logbook-ta-nginx
    restart: unless-stopped
    ports:
      - "8280:80"
    volumes:
      # Fix #6: nginx kini punya akses ke folder public yang sama dgn app.
      - public_pp:/var/www/public:ro
    depends_on:
      - logbook-ta-app
    networks: [backend]

  # ---------------------------------------------------------------- db
  logbook-ta-db:
    image: mysql:8.4
    container_name: logbook-ta-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: logbook_ta
      MYSQL_USER: logbook
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in the deployment environment}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the deployment environment}"
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the deployment environment}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]

  # -------------------------------------------------------------- redis
  logbook-ta-redis:
    image: redis:7-alpine
    container_name: logbook-ta-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  # ----------------------------------------------------------- mailpit
  logbook-ta-mailpit:
    image: axllent/mailpit:latest
    container_name: logbook-ta-mailpit
    restart: unless-stopped
    ports:
      # Bind Mailpit to localhost by default; do not expose it publicly.
      - "${MAILPIT_BIND_IP:-127.0.0.1}:8225:8025"   # UI
      - "${MAILPIT_BIND_IP:-127.0.0.1}:8226:1025"   # SMTP
    networks: [backend]

  # ------------------------------------------------------------ queue
  logbook-ta-queue:
    image: logbook-ta-app:latest
    container_name: logbook-ta-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    environment: *app-env
    depends_on:
      logbook-ta-app:
        condition: service_started
      logbook-ta-mailpit:
        condition: service_started
    volumes:
      - app_storage:/var/www/storage
      - public_pp:/var/www/public
    networks: [backend]

  # -------------------------------------------------------- scheduler
  logbook-ta-scheduler:
    image: logbook-ta-app:latest
    container_name: logbook-ta-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment: *app-env
    depends_on:
      logbook-ta-app:
        condition: service_started
    volumes:
      - app_storage:/var/www/storage
      - public_pp:/var/www/public
    networks: [backend]

  # ---------------------------------------------------------- reverb
  logbook-ta-reverb:
    image: logbook-ta-app:latest
    container_name: logbook-ta-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment: *app-env
    depends_on:
      logbook-ta-app:
        condition: service_started
    networks: [backend]

volumes:
  app_storage:
  public_pp:
  db_data:
  redis_data:

networks:
  backend:
    driver: bridge
